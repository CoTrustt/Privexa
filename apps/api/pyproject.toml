[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "privexa-api"
version = "0.1.0"
description = "Privexa backend application"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "presidio-analyzer>=2.2.364,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "stytch>=15.3,<16",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ai_integration: tests requiring a configured external AI provider",
  "security: adversarial security regression tests",
  "storage_integration: tests requiring the local S3-compatible object store",
  "tenant_isolation: tenant escape and authorization hard-gate tests",
]
