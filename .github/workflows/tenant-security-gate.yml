name: Privexa Build 0 - Tenant Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tenant-security-gate:
    name: tenant-security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: privexa_dev
      PRIVEXA_TEST_DB: privexa_test
      POSTGRES_USER: privexa_owner
      POSTGRES_PASSWORD: ci-owner-password
      PRIVEXA_APP_DB_USER: privexa_app
      PRIVEXA_APP_DB_PASSWORD: ci-runtime-password
      DATABASE_URL: postgresql+psycopg://privexa_owner:ci-owner-password@localhost:5432/privexa_test
      APP_DATABASE_URL: postgresql+psycopg://privexa_app:ci-runtime-password@localhost:5432/privexa_test
      TEST_DATABASE_URL: postgresql+psycopg://privexa_owner:ci-owner-password@localhost:5432/privexa_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://privexa_app:ci-runtime-password@localhost:5432/privexa_test
      PRIVEXA_ENVIRONMENT: test
      PRIVEXA_WEB_ORIGIN: http://localhost:3000
      STYTCH_PROJECT_ID: project-test-ci
      STYTCH_SECRET: secret-test-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Start PostgreSQL 17 with owner and runtime roles
        run: docker compose up -d --wait postgres

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --dev

      - name: Apply Alembic migrations to the test database
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Run API lint
        working-directory: apps/api
        run: uv run ruff check .

      - name: Create test report directory
        run: mkdir -p apps/api/test-results

      - name: Run non-security API regression tests
        working-directory: apps/api
        run: >-
          uv run pytest -m "not tenant_isolation" --junitxml=test-results/api-regression.xml

      - name: Run tenant isolation hard gate
        working-directory: apps/api
        run: >-
          uv run pytest -m tenant_isolation --junitxml=test-results/tenant-security.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-security-test-reports
          path: apps/api/test-results/*.xml
          if-no-files-found: warn

      - name: Show PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Stop test infrastructure
        if: always()
        run: docker compose down -v
