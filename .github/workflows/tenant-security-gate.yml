name: Privexa Build 0 - Tenant Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web lint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript validation
        working-directory: apps/web
        run: npm run typecheck

      - name: Run web component and route tests
        working-directory: apps/web
        run: npm run test:run

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run fast browser regression tests
        working-directory: apps/web
        run: npm run e2e

      - name: Build production web application
        working-directory: apps/web
        run: npm run build

  tenant-security-gate:
    name: tenant-security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: privexa_dev
      PRIVEXA_TEST_DB: privexa_test
      POSTGRES_USER: privexa_owner
      POSTGRES_PASSWORD: ci-owner-password
      PRIVEXA_APP_DB_USER: privexa_app
      PRIVEXA_APP_DB_PASSWORD: ci-runtime-password
      DATABASE_URL: postgresql+psycopg://privexa_owner:ci-owner-password@localhost:5432/privexa_test
      APP_DATABASE_URL: postgresql+psycopg://privexa_app:ci-runtime-password@localhost:5432/privexa_test
      TEST_DATABASE_URL: postgresql+psycopg://privexa_owner:ci-owner-password@localhost:5432/privexa_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://privexa_app:ci-runtime-password@localhost:5432/privexa_test
      PRIVEXA_ENVIRONMENT: test
      PRIVEXA_WEB_ORIGIN: http://localhost:3000
      STYTCH_PROJECT_ID: project-test-ci
      STYTCH_SECRET: secret-test-ci
      MINIO_ROOT_USER: privexa-ci-admin
      MINIO_ROOT_PASSWORD: ci-minio-password
      OBJECT_STORAGE_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: privexa-test
      TEST_OBJECT_STORAGE_BUCKET: privexa-test
      OBJECT_STORAGE_ACCESS_KEY: privexa-ci-app
      OBJECT_STORAGE_SECRET_KEY: ci-app-storage-password
      OBJECT_STORAGE_ADDRESSING_STYLE: path
      FILE_UPLOAD_URL_TTL_SECONDS: 900
      FILE_UPLOAD_COMPLETION_GRACE_SECONDS: 300
      FILE_DOWNLOAD_URL_TTL_SECONDS: 120
      MAX_FILE_UPLOAD_SIZE_BYTES: 52428800

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Node.js for the full-stack browser gate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start PostgreSQL and private S3-compatible storage
        run: |
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --dev

      - name: Apply Alembic migrations to the test database
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Run API lint
        working-directory: apps/api
        run: uv run ruff check .

      - name: Create test report directory
        run: mkdir -p apps/api/test-results

      - name: Run non-security API regression tests
        working-directory: apps/api
        run: >-
          uv run pytest -m "not tenant_isolation" --junitxml=test-results/api-regression.xml

      - name: Run tenant isolation hard gate
        working-directory: apps/api
        run: >-
          uv run pytest -m tenant_isolation --junitxml=test-results/tenant-security.xml

      - name: Install web dependencies for the full-stack browser gate
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium for the full-stack browser gate
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run PostgreSQL-backed Question browser acceptance
        working-directory: apps/web
        run: npm run e2e:fullstack

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tenant-security-test-reports
          path: apps/api/test-results/*.xml
          if-no-files-found: warn

      - name: Show PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose logs --no-color postgres minio minio-init

      - name: Stop test infrastructure
        if: always()
        run: docker compose down -v
