services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PRIVEXA_TEST_DB: ${PRIVEXA_TEST_DB:-privexa_test}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PRIVEXA_APP_DB_USER: ${PRIVEXA_APP_DB_USER:?Set PRIVEXA_APP_DB_USER in .env}
      PRIVEXA_APP_DB_PASSWORD: ${PRIVEXA_APP_DB_PASSWORD:?Set PRIVEXA_APP_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - privexa_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  privexa_postgres_data:
